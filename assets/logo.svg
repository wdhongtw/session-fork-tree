<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Session Fork Tree">
  <style>
    .right-card { stroke-width: 4px; }
    .bridge-line { stroke-width: 6.5px; }
    .bridge-node { r: 8.5px; }
    @media (max-width: 28px) {
      .detail-only { display: none; }
      .right-card { stroke-width: 6px; }
      .bridge-line { stroke-width: 8.5px; }
      .bridge-node { r: 10px; }
    }
  </style>

  <!-- Origin / Parent Session Card (Left - Solid Blue with Window Header) -->
  <rect x="12" y="14" width="56" height="76" rx="13" fill="#2563eb"/>
  <path d="M12 27C12 19.8203 17.8203 14 25 14H55C62.1797 14 68 19.8203 68 27V31H12V27Z" fill="#60a5fa"/>
  <g class="detail-only">
    <rect x="22" y="40" width="34" height="6" rx="3" fill="#eff6ff"/>
    <rect x="22" y="66" width="28" height="6" rx="3" fill="#93c5fd"/>
  </g>

  <!-- Forked Child Session Card (Right - Solid Violet with Window Header) -->
  <rect class="right-card" x="58" y="36" width="58" height="78" rx="13" fill="#7c3aed" stroke="#0f172a"/>
  <path d="M60 49C60 42.9249 64.9249 38 71 38H103C109.075 38 114 42.9249 114 49V53H60V49Z" fill="#c084fc"/>
  <g class="detail-only">
    <rect x="70" y="62" width="34" height="6" rx="3" fill="#faf5ff"/>
    <rect x="70" y="92" width="30" height="6" rx="3" fill="#d8b4fe"/>
  </g>

  <!-- Grayscale Fork Connection Line & Endpoints (No Surrounding Outline) -->
  <path class="bridge-line" d="M40 53C58 53 60 78 80 78" stroke="#cbd5e1" stroke-linecap="round"/>
  <circle class="bridge-node" cx="40" cy="53" fill="#e2e8f0"/>
  <circle class="bridge-node" cx="80" cy="78" fill="#f8fafc"/>
</svg>
